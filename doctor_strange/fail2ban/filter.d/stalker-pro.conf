# Fail2ban filter for Stalker Pro 2.0 Perimeter Defense Shield
# Path: /etc/fail2ban/filter.d/stalker-pro.conf
# Matches syslog lines emitted to doctor_strange/perimeter_threats.log

[Definition]
# Example log:
# [2026-11-07T01:30:00.000Z] [PERIMETER-FIREWALL] [BAN] IP=198.51.100.23 MAC=00:1A:79:B2:C3:D4 DEV=NONE DURATION=PERMANENT DETAIL="Exploit Signature Detected"

failregex = ^\[.+\] \[PERIMETER-FIREWALL\] \[(?:BAN|HONEYPOT_TRAP|EXPLOIT_PAYLOAD|MALICIOUS_BOT|BRUTE_FORCE_ATTEMPT)\] IP=<HOST>
ignoreregex = 
