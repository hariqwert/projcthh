  <script>
    (function() {
      const K_RE = /kaspersky|kis\.v2\.scr\.kaspersky-labs\.com|FD126C42-EBFA-4E12-B309-BB3FDD723AC1|AB890240-720E-417E-8A8B-53E427136F0B/i;
      const cleanNode = (n) => {
        if (!n || n.nodeType !== 1) return false;
        const s = (n.src || '') + ' ' + (n.href || '') + ' ' + (n.id || '') + ' ' + (n.className || '');
        if (K_RE.test(s)) { try { n.remove(); } catch(_) {} return true; }
        return false;
      };
      const mo = new MutationObserver((list) => {
        for (const m of list) {
          for (const node of m.addedNodes) cleanNode(node);
        }
      });
      mo.observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>

  <script>
    const TMDB_KEY = "9d83476d2e27f56748167514c69cd2b4";
    let currentMediaId = null;
    let currentMediaType = 'movie';
    let currentSeason = 1;
    let currentEpisode = 1;
    let currentServer = 'vidlink';
    let currentMediaData = null;

    const urlParams = new URLSearchParams(window.location.search);
    const paramId = urlParams.get('id') || urlParams.get('tmdbId');
    const paramType = urlParams.get('type') || 'movie';
    const paramSeason = parseInt(urlParams.get('s') || '1', 10);
    const paramEpisode = parseInt(urlParams.get('e') || '1', 10);
    const paramQuery = urlParams.get('q') || urlParams.get('title') || urlParams.get('search');

    if (paramId) currentMediaId = paramId;
    if (paramType) currentMediaType = paramType;
    if (paramSeason) currentSeason = paramSeason;
    if (paramEpisode) currentEpisode = paramEpisode;

    async function initPage() {
      if (paramQuery) {
        await searchAndLoad(paramQuery);
      } else if (paramId) {
        await loadMediaDetails(currentMediaId, currentMediaType);
      } else {
        try {
          const res = await fetch(`https://api.themoviedb.org/3/trending/movie/week?api_key=${TMDB_KEY}`);
          const json = await res.json();
          if (json.results && json.results.length > 0) {
            currentMediaId = json.results[0].id;
            currentMediaType = 'movie';
            await loadMediaDetails(currentMediaId, currentMediaType);
          } else {
            currentMediaId = 872585;
            await loadMediaDetails(currentMediaId, 'movie');
          }
        } catch (e) {
          currentMediaId = 872585;
          await loadMediaDetails(currentMediaId, 'movie');
        }
      }
      updatePlayerUrl();
      if (window.lucide) lucide.createIcons();
    }

    async function searchAndLoad(query) {
      try {
        const bingrRes = await fetch(`/api/bingr/search?q=${encodeURIComponent(query)}`);
        const bingrJson = await bingrRes.json();
        if (bingrJson?.results && bingrJson.results.length > 0) {
          const item = bingrJson.results[0];
          currentMediaId = item.id;
          currentMediaType = item.type || (item.name ? 'tv' : 'movie');
          await loadMediaDetails(currentMediaId, currentMediaType);
          return;
        }
      } catch (e) {}

      try {
        const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}`);
        const json = await res.json();
        if (json.results && json.results.length > 0) {
          const item = json.results.find(r => r.media_type !== 'person') || json.results[0];
          currentMediaId = item.id;
          currentMediaType = item.media_type || (item.title ? 'movie' : 'tv');
          await loadMediaDetails(currentMediaId, currentMediaType);
        }
      } catch (e) {
        console.error('Search failed:', e);
      }
    }

    async function loadMediaDetails(id, type) {
      try {
        const [detailsRes, creditsRes, videosRes, similarRes] = await Promise.all([
          fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${TMDB_KEY}&append_to_response=release_dates,content_ratings`),
          fetch(`https://api.themoviedb.org/3/${type}/${id}/credits?api_key=${TMDB_KEY}`),
          fetch(`https://api.themoviedb.org/3/${type}/${id}/videos?api_key=${TMDB_KEY}`),
          fetch(`https://api.themoviedb.org/3/${type}/${id}/similar?api_key=${TMDB_KEY}`)
        ]);

        const details = await detailsRes.json();
        const credits = await creditsRes.json();
        const videos = await videosRes.json();
        const similar = await similarRes.json();

        currentMediaData = details;
        renderDetails(details, credits, videos, similar);
      } catch (e) {
        console.error('Failed to load media details:', e);
      }
    }

    function renderDetails(details, credits, videos, similar) {
      const title = details.title || details.name || 'Untitled';
      document.title = `${title} | Stalker Pro`;

      const backdrop = details.backdrop_path
        ? `https://image.tmdb.org/t/p/original${details.backdrop_path}`
        : (details.poster_path ? `https://image.tmdb.org/t/p/original${details.poster_path}` : '');
      const poster = details.poster_path
        ? `https://image.tmdb.org/t/p/w500${details.poster_path}`
        : '';

      if (backdrop) document.getElementById('media-backdrop').src = backdrop;
      if (poster) document.getElementById('media-poster').src = poster;
      document.getElementById('media-title').textContent = title;
      document.getElementById('media-tagline').textContent = details.tagline || '';
      document.getElementById('media-overview').textContent = details.overview || 'No synopsis available.';

      const rating = details.vote_average ? details.vote_average.toFixed(1) : '8.0';
      document.getElementById('media-rating-badge').textContent = `★ ${rating}`;

      const year = (details.release_date || details.first_air_date || '').substring(0, 4) || '2024';
      document.getElementById('media-year-badge').textContent = year;

      const runtime = details.runtime ? `${Math.floor(details.runtime / 60)}h ${details.runtime % 60}m` : (details.episode_run_time?.[0] ? `${details.episode_run_time[0]}m` : 'Series');
      document.getElementById('media-runtime-badge').textContent = runtime;
      document.getElementById('media-type-badge').textContent = currentMediaType.toUpperCase();

      const genresContainer = document.getElementById('media-genres');
      genresContainer.innerHTML = (details.genres || []).map(g => `
        <span class="px-2.5 py-0.5 bg-zinc-900 border border-zinc-800 text-zinc-300 rounded text-xs font-medium">${g.name}</span>
      `).join('');

      const director = (credits.crew || []).find(c => c.job === 'Director')?.name || '—';
      document.getElementById('media-director').textContent = director;
      document.getElementById('media-status').textContent = details.status || 'Released';
      document.getElementById('media-language').textContent = (details.original_language || 'EN').toUpperCase();
      document.getElementById('media-budget').textContent = details.budget ? `$${details.budget.toLocaleString()}` : '—';
      document.getElementById('media-revenue').textContent = details.revenue ? `$${details.revenue.toLocaleString()}` : '—';
      document.getElementById('media-imdb').textContent = details.imdb_id || '—';

      const nextAlertEl = document.getElementById('media-next-episode-alert');
      if (currentMediaType === 'tv' && details.next_episode_to_air) {
        const ne = details.next_episode_to_air;
        let dateFormatted = ne.air_date || 'TBA';
        try {
          if (ne.air_date) {
            const d = new Date(ne.air_date + 'T00:00:00');
            dateFormatted = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          }
        } catch(e) {}
        if (nextAlertEl) {
          nextAlertEl.innerHTML = `
            <div class="inline-flex items-center gap-3 px-3.5 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-xs text-zinc-200">
              <span class="font-semibold text-zinc-400 uppercase tracking-wider text-[10px]">Next Episode</span>
              <span class="font-bold text-white">S${ne.season_number} E${ne.episode_number}${ne.name ? ` · ${ne.name}` : ''}</span>
              <span class="px-2 py-0.5 bg-zinc-800 text-zinc-200 font-mono text-[11px] rounded">${dateFormatted}</span>
            </div>
          `;
          nextAlertEl.classList.remove('hidden');
        }
      } else if (nextAlertEl) {
        nextAlertEl.classList.add('hidden');
        nextAlertEl.innerHTML = '';
      }

      if (currentMediaType === 'tv' && details.seasons) {
        const tvContainer = document.getElementById('tv-controls-container');
        tvContainer.classList.remove('hidden');
        const seasonSelect = document.getElementById('season-select');
        seasonSelect.innerHTML = details.seasons.filter(s => s.season_number > 0).map(s => `
          <option value="${s.season_number}" ${s.season_number === currentSeason ? 'selected' : ''}>Season ${s.season_number} (${s.episode_count} eps)</option>
        `).join('');
        populateEpisodes(currentSeason);

        let dispSeason = currentSeason;
        let dispEp = 1;
        const validSeasons = details.seasons.filter(s => s.season_number > 0 && s.episode_count > 0);
        if (validSeasons.length > 0) {
          const lastS = validSeasons[validSeasons.length - 1];
          dispSeason = lastS.season_number;
          dispEp = lastS.episode_count;
        }
        const heroBingText = document.getElementById('btn-hero-bing-text');
        if (heroBingText) {
          heroBingText.textContent = `Play S${dispSeason} E${dispEp}`;
        }
      } else {
        const heroBingText = document.getElementById('btn-hero-bing-text');
        if (heroBingText) heroBingText.textContent = 'Play Movie';
      }

      const castContainer = document.getElementById('media-cast-container');
      castContainer.innerHTML = (credits.cast || []).slice(0, 12).map(c => `
        <div class="shrink-0 w-28 surface-card rounded-xl p-2.5 text-center space-y-1.5">
          <img loading="lazy" src="${c.profile_path ? 'https://image.tmdb.org/t/p/w185' + c.profile_path : 'https://ui-avatars.com/api/?name=' + encodeURIComponent(c.name) + '&background=18181b&color=f4f4f5'}" class="w-16 h-16 rounded-full object-cover mx-auto border border-zinc-800 bg-zinc-900" alt="${c.name}">
          <p class="text-xs font-semibold text-zinc-100 truncate">${c.name}</p>
          <p class="text-[10px] text-zinc-500 truncate">${c.character || 'Cast'}</p>
        </div>
      `).join('');

      const similarContainer = document.getElementById('similar-movies-container');
      similarContainer.innerHTML = (similar.results || []).slice(0, 12).map(s => `
        <a href="/info.html?id=${s.id}&type=${s.media_type || currentMediaType}" class="shrink-0 w-36 sm:w-40 group space-y-1.5">
          <div class="aspect-[2/3] rounded-xl overflow-hidden bg-zinc-900 border border-zinc-800 group-hover:border-zinc-600 transition-colors">
            <img loading="lazy" src="${s.poster_path ? 'https://image.tmdb.org/t/p/w342' + s.poster_path : ''}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" alt="${s.title || s.name}">
          </div>
          <p class="text-xs font-semibold text-zinc-200 group-hover:text-white truncate">${s.title || s.name}</p>
        </a>
      `).join('');

      const trailer = (videos.results || []).find(v => v.type === 'Trailer' && v.site === 'YouTube') || videos.results?.[0];
      if (trailer) {
        document.getElementById('trailer-iframe').dataset.src = `https://www.youtube-nocookie.com/embed/${trailer.key}?autoplay=1`;
      }
      if (window.lucide) lucide.createIcons();
    }

    function populateEpisodes(seasonNum) {
      const episodeSelect = document.getElementById('episode-select');
      const seasonObj = (currentMediaData?.seasons || []).find(s => Number(s.season_number) === Number(seasonNum));
      const count = seasonObj?.episode_count || 24;
      episodeSelect.innerHTML = Array.from({ length: count }, (_, i) => i + 1).map(ep => `
        <option value="${ep}" ${ep === currentEpisode ? 'selected' : ''}>Episode ${ep}</option>
      `).join('');
    }

    function onSeasonChange() {
      currentSeason = parseInt(document.getElementById('season-select').value, 10);
      currentEpisode = 1;
      populateEpisodes(currentSeason);
      updatePlayerUrl();
    }

    function onEpisodeChange() {
      currentEpisode = parseInt(document.getElementById('episode-select').value, 10);
      updatePlayerUrl();
    }

    function setServer(serverKey) {
      currentServer = serverKey;
      document.querySelectorAll('.btn-server').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById(`srv-btn-${serverKey}`);
      if (btn) btn.classList.add('active');
      updatePlayerUrl();
    }

    function updatePlayerUrl() {
      const iframe = document.getElementById('cinema-iframe');
      const loader = document.getElementById('player-loader');
      loader.classList.remove('hidden');

      let url = '';
      if (currentMediaType === 'tv') {
        switch (currentServer) {
          case 'vidsrc': url = `https://vidsrc.to/embed/tv/${currentMediaId}/${currentSeason}/${currentEpisode}`; break;
          case 'superembed': url = `https://multiembed.mov/directstream.php?video_id=${currentMediaId}&tmdb=1&s=${currentSeason}&e=${currentEpisode}`; break;
          case 'vidlink': url = `https://vidlink.pro/tv/${currentMediaId}/${currentSeason}/${currentEpisode}?autoplay=true`; break;
          case 'twoembed': url = `https://www.2embed.cc/embedtv/${currentMediaId}?s=${currentSeason}&e=${currentEpisode}`; break;
          case 'vidrift': url = `https://embed.vidrift.in/embed/tv/${currentMediaId}/${currentSeason}/${currentEpisode}`; break;
          case 'cinezo': url = `https://player.cinezo.live/embed/tv/${currentMediaId}/${currentSeason}/${currentEpisode}`; break;
          case 'vidbinge': url = `https://vidbinge.dev/embed/tv/${currentMediaId}/${currentSeason}/${currentEpisode}`; break;
          default: url = `https://vidlink.pro/tv/${currentMediaId}/${currentSeason}/${currentEpisode}?autoplay=true`;
        }
      } else {
        switch (currentServer) {
          case 'vidsrc': url = `https://vidsrc.to/embed/movie/${currentMediaId}`; break;
          case 'superembed': url = `https://multiembed.mov/directstream.php?video_id=${currentMediaId}&tmdb=1`; break;
          case 'vidlink': url = `https://vidlink.pro/movie/${currentMediaId}?autoplay=true`; break;
          case 'twoembed': url = `https://www.2embed.cc/embed/${currentMediaId}`; break;
          case 'vidrift': url = `https://embed.vidrift.in/embed/movie/${currentMediaId}`; break;
          case 'cinezo': url = `https://player.cinezo.live/embed/movie/${currentMediaId}`; break;
          case 'vidbinge': url = `https://vidbinge.dev/embed/movie/${currentMediaId}`; break;
          default: url = `https://vidlink.pro/movie/${currentMediaId}?autoplay=true`;
        }
      }

      iframe.src = url;
      iframe.onload = () => {
        setTimeout(() => loader.classList.add('hidden'), 400);
      };
    }

    function scrollToPlayer() {
      document.getElementById('cinema-player-section').scrollIntoView({ behavior: 'smooth' });
    }

    function openTrailerModal() {
      const modal = document.getElementById('trailer-modal');
      const iframe = document.getElementById('trailer-iframe');
      if (iframe && iframe.dataset.src && !iframe.src) {
        iframe.src = iframe.dataset.src;
      }
      modal.classList.remove('hidden');
    }

    function closeTrailerModal() {
      document.getElementById('trailer-modal').classList.add('hidden');
      const iframe = document.getElementById('trailer-iframe');
      if (iframe) iframe.src = '';
    }

    function openTorrentPlayer() {
      const title = currentMediaData?.title || currentMediaData?.name || 'movie';
      window.location.href = `/consumet.html#torrent?q=${encodeURIComponent(title)}&type=${currentMediaType}&s=${currentSeason}&e=${currentEpisode}`;
    }

    function playWithBing() {
      const title = currentMediaData?.title || currentMediaData?.name || 'Media';
      const year = (currentMediaData?.release_date || currentMediaData?.first_air_date || '').substring(0, 4);
      let queryParams = `type=${currentMediaType}&media_type=${currentMediaType}&id=${currentMediaId}&tmdbId=${currentMediaId}&title=${encodeURIComponent(title)}&srv=vidlink`;
      if (year) queryParams += `&year=${year}`;
      if (currentMediaType === 'tv') {
        let epToPlay = currentEpisode || 1;
        let sToPlay = currentSeason || 1;
        if (currentMediaData?.seasons) {
          const valid = currentMediaData.seasons.filter(s => s.season_number > 0 && s.episode_count > 0);
          if (valid.length > 0 && currentSeason === 1 && currentEpisode === 1) {
            sToPlay = valid[valid.length - 1].season_number;
            epToPlay = valid[valid.length - 1].episode_count;
          }
        }
        queryParams += `&season=${sToPlay}&episode=${epToPlay}&s=${sToPlay}&e=${epToPlay}`;
      }
      window.location.href = `/play_bingr.php?${queryParams}`;
    }

    window.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
